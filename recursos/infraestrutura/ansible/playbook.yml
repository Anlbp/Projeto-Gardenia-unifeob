---
# Configuração da VM 1 (Simulador)
- name: Configurar VM 1 - Simulador de Dados
  hosts: vm_simulador
  become: yes
  tasks:
    - name: Criar diretórios
      file:
        path: /home/debian/simulador/saida
        state: directory
        owner: debian
        group: debian

    - name: Copiar código do Simulador
      copy:
        src: ../../simulador/simulador.py
        dest: /home/debian/simulador/simulador.py
        owner: debian
        mode: '0755'

# Configuração da VM 2 (Tratamento / Limpeza)
- name: Configurar VM 2 - Pipeline de Limpeza
  hosts: vm_tratamento
  become: yes
  tasks:
    - name: Instalar dependências de sistema e Python
      apt:
        name: [python3-pandas, python3-numpy, python3-matplotlib]
        state: present
        update_cache: yes

    - name: Criar diretórios de trabalho
      file:
        path: /home/debian/gardenia
        state: directory
        owner: debian
        group: debian

    - name: Copiar pipeline_vm2.py
      copy:
        src: ../../simulador/pipeline_vm2.py
        dest: /home/debian/gardenia/pipeline_vm2.py
        owner: debian
        mode: '0755'

# Configuração da VM 3 (Big Data / Spark)
- name: Configurar VM 3 - Spark Big Data
  hosts: vm_spark
  become: yes
  tasks:
    - name: Instalar Java 17 e Pacotes de Dados
      apt:
        name: [default-jre-headless, python3-pip, python3-pandas, python3-numpy, python3-matplotlib]
        state: present
        update_cache: yes

    - name: Instalar PySpark via Pip
      pip:
        name: pyspark
        executable: pip3
        # Burla uma medida de segurança
        # Necessario para a instalação do Spark na VM
        extra_args: --break-system-packages

    - name: Criar diretórios de trabalho
      file:
        path: /home/debian/spark_work
        state: directory
        owner: debian
        group: debian

    - name: Copiar pipeline_vm3.py
      copy:
        src: ../../simulador/pipeline_vm3.py
        dest: /home/debian/spark_work/pipeline_vm3.py
        owner: debian
        mode: '0755'