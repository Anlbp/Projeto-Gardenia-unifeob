---
- name: Configuração comum do cluster (SSH, hosts, permissões)
  hosts: all
  become: yes
  tasks:
    - name: Garantir permissões do usuário debian em sua pasta home
      ansible.builtin.file:
        path: /home/debian
        owner: debian
        group: debian
        recurse: yes

    - name: Registrar os IPs atuais do cluster no /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^.*\s{{ item }}(\s|$)'
        line: "{{ hostvars[item]['ansible_host'] }} {{ item }}"
        state: present
      loop: "{{ groups['all'] }}"

    - name: Garantir diretório .ssh
      ansible.builtin.file:
        path: /home/debian/.ssh
        state: directory
        owner: debian
        group: debian
        mode: '0700'

    - name: Distribuir chave privada RSA do cluster (PEM)
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"   # sem espaço no lookup
        dest: /home/debian/.ssh/id_rsa
        owner: debian
        group: debian
        mode: '0600'
        force: yes
        validate: "ssh-keygen -y -f %s"
      register: chave_copiada

    - name: Validar chave PEM em cada host
      ansible.builtin.shell:
        cmd: |
          set -e
          head -1 /home/debian/.ssh/id_rsa | grep -q "BEGIN RSA PRIVATE KEY" || {
            echo "ERRO: chave não é PEM em {{ inventory_hostname }}"; exit 1;
          }
          ssh-keygen -y -f /home/debian/.ssh/id_rsa > /dev/null 2>&1 || {
            echo "ERRO: chave inválida (libcrypto) em {{ inventory_hostname }}"; exit 1;
          }
          echo "OK: {{ inventory_hostname }} — chave PEM válida"
      register: validacao
      changed_when: false
      failed_when: validacao.rc != 0

    - name: Mostrar validação por host
      ansible.builtin.debug:
        msg: "{{ validacao.stdout }}"

    - name: Autorizar chave pública em authorized_keys
      ansible.posix.authorized_key:
        user: debian
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"

# Configuração da VM 1 (Simulador)
- name: Configurar VM 1 - Simulador de Dados
  hosts: vm_simulador
  become: yes
  tasks:
    - name: Instalar R (Linguagem de Programação)
      ansible.builtin.apt:
        name: r-base
        state: present
        update_cache: yes
        lock_timeout: 320
        
    - name: Criar diretórios
      ansible.builtin.file:
        path: /home/debian/simulador/saida
        state: directory
        owner: debian
        group: debian

    - name: Copiar código do Simulador
      ansible.builtin.copy:
        src: ../../simulador/simulador.R
        dest: /home/debian/simulador/simulador.R
        owner: debian
        mode: '0755'

    - name: Criar serviço Systemd para o Simulador
      ansible.builtin.copy:
        dest: /etc/systemd/system/gardenia-simulador.service
        content: |
          [Unit]
          Description=Servico Simulador de Dados R (VM1)
          After=network.target

          [Service]
          Type=simple
          User=debian
          WorkingDirectory=/home/debian/simulador
          ExecStart=/usr/bin/Rscript /home/debian/simulador/simulador.R --ciclos 0 --intervalo 10
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Ativar e iniciar o servico do Simulador
      ansible.builtin.systemd:
        name: gardenia-simulador
        state: started
        enabled: yes
        daemon_reload: yes

# Configuração da VM 2 (Tratamento / Limpeza)
- name: Configurar VM 2 - Pipeline de Limpeza
  hosts: vm_tratamento
  become: yes
  handlers:
    - name: Reiniciar gardenia-vm2
      ansible.builtin.systemd:
        name: gardenia-vm2
        state: restarted
        daemon_reload: yes
  tasks:
    - name: Instalar dependências de sistema e R
      ansible.builtin.apt:
        name: 
          - r-base
          - rsync
          - r-cran-tidyverse
          - r-cran-optparse
          - r-cran-jsonlite
        state: present
        update_cache: yes
        lock_timeout: 320

    - name: Criar diretórios de trabalho
      ansible.builtin.file:
        path: /home/debian/gardenia
        state: directory
        owner: debian
        group: debian

    - name: Copiar pipeline_vm2.R
      ansible.builtin.copy:
        src: ../../simulador/pipeline_vm2.R
        dest: /home/debian/gardenia/pipeline_vm2.R
        owner: debian
        mode: '0755'

    - name: Criar serviço Systemd para o Tratamento
      vars:
        ip_vm1: "{{ hostvars[groups['vm_simulador'][0]].ansible_host }}"
        pasta_trabalho: "/home/debian/gardenia"
        pasta_entrada:  "{{ pasta_trabalho }}/dados_brutos"
        pasta_saida:    "{{ pasta_trabalho }}/saida"
      ansible.builtin.copy:
        dest: /etc/systemd/system/gardenia-vm2.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Servico Tratamento em R (VM2) - Gardenia
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=120
          StartLimitBurst=5

          [Service]
          Type=simple
          User=debian
          Group=debian
          WorkingDirectory={{ pasta_trabalho }}
          ExecStart=/usr/bin/Rscript {{ pasta_trabalho }}/pipeline_vm2.R \
            --origem debian@{{ ip_vm1 }}:/home/debian/simulador/saida \
            --destino {{ pasta_entrada }} \
            --saida   {{ pasta_saida }} \
            --intervalo 15
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal

          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
      notify: Reiniciar gardenia-vm2

    - name: Garantir serviço habilitado e rodando
      ansible.builtin.systemd:
        name: gardenia-vm2
        state: started
        enabled: yes
        daemon_reload: yes

# Configuração da VM 3 (Big Data / Spark e MongoDB)
- name: Configurar VM 3 - Spark Big Data e Mongo DB
  hosts: vm_spark
  become: yes
  vars_files:
    - vars/vault.yml
  tasks:
    - name: Criar diretório para chaves de repositórios (keyrings)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    
    # Elimina conflito do Signed-By
    - name: Remover lista antiga do repositório MongoDB
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/mongodb-org-8.0.list
        state: absent
    
    - name: Adicionar chave GPG oficial do MongoDB
      ansible.builtin.shell:
        cmd: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
          gpg --dearmor -o /etc/apt/keyrings/mongodb-server-8.0.gpg
        creates: /etc/apt/keyrings/mongodb-server-8.0.gpg

    - name: Adicionar repositório oficial do MongoDB
      ansible.builtin.apt_repository:
        repo: "deb [ signed-by=/etc/apt/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/debian bookworm/mongodb-org/8.0 main"
        state: present
        filename: mongodb-org-8.0

    - name: Instalar pacotes necessários
      ansible.builtin.apt:
        name: 
          - default-jre-headless
          - rsync
          - r-base
          - r-base-dev
          - r-cran-tidyverse
          - r-cran-jsonlite
          - r-cran-optparse
          - libssl-dev
          - libcurl4-openssl-dev
          - libxml2-dev
          - libsasl2-dev
          - curl
          - gnupg
          - mongodb-org
        state: present
        update_cache: yes
        lock_timeout: 888
    
    - name: Garantir que o serviço do MongoDB está ativo
      ansible.builtin.systemd:
        name: mongod
        state: started
        enabled: yes

    - name: Instalar sparklyr e mongolite via CRAN
      command: >
        Rscript -e "
          if (!require('sparklyr', quietly = TRUE)) install.packages('sparklyr', repos='https://cloud.r-project.org');
          if (!require('mongolite', quietly = TRUE)) install.packages('mongolite', repos='https://cloud.r-project.org')
        "

    - name: Baixar e Instalar binários do Apache Spark no R para o usuário debian
      become_user: debian
      command: >
        Rscript -e "
          avail <- sparklyr::spark_available_versions();
          v3 <- tail(avail$spark[startsWith(avail$spark, '3.')], 1);
          if (nrow(sparklyr::spark_installed_versions()) == 0) sparklyr::spark_install(version = v3)
        "

    - name: Criar diretórios de trabalho
      ansible.builtin.file:
        path: /home/debian/spark_work
        state: directory
        owner: debian
        group: debian

    - name: Copiar pipeline_vm3.R
      ansible.builtin.copy:
        src: ../../simulador/pipeline_vm3.R
        dest: /home/debian/spark_work/pipeline_vm3.R
        owner: debian
        mode: '0755'

    - name: Criar serviço Systemd para VM3 (Spark + MongoDB + Atlas)
      vars:
        ip_vm2: "{{ hostvars[groups['vm_tratamento'][0]].ansible_host }}"
      ansible.builtin.copy:
        dest: /etc/systemd/system/gardenia-vm3.service
        content: |
          [Unit]
          Description=Servico VM3 - Spark, MongoDB e Atlas em R
          After=network.target mongod.service

          [Service]
          Type=simple
          User=debian
          WorkingDirectory=/home/debian/spark_work
          Environment="MONGO_URL={{ mongo_atlas_url }}"
          ExecStart=/usr/bin/Rscript /home/debian/spark_work/pipeline_vm3.R -o debian@{{ ip_vm2 }}:/home/debian/gardenia/saida -i 30
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Ativar e iniciar o servico da VM3
      ansible.builtin.systemd:
        name: gardenia-vm3
        state: started
        enabled: yes
        daemon_reload: yes