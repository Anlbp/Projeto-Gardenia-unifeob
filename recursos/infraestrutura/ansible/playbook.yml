---
# Configuração da VM 1 (Simulador)
- name: Configurar VM 1 - Simulador de Dados
  hosts: vm_simulador
  become: yes
  tasks:
    - name: Garantir permissões do usuário debian em sua pasta home
      file:
        path: /home/debian
        owner: debian
        group: debian
        recurse: yes

    - name: Instalar r
      apt:
        name: r-base
        state: present
        update_cache: yes
        
    - name: Criar diretórios
      file:
        path: /home/debian/simulador/saida
        state: directory
        owner: debian
        group: debian

    - name: Copiar código do Simulador
      copy:
        src: ../../simulador/simulador.R
        dest: /home/debian/simulador/simulador.R
        owner: debian
        mode: '0755'

# Configuração da VM 2 (Tratamento / Limpeza)
- name: Configurar VM 2 - Pipeline de Limpeza
  hosts: vm_tratamento
  become: yes
  tasks:
    - name: Garantir permissões do usuário debian em sua pasta home
      file:
        path: /home/debian
        owner: debian
        group: debian
        recurse: yes

    - name: Instalar dependências de sistema e R
      apt:
        name: [r-base, r-cran-tidyverse, r-cran-optparse, r-cran-jsonlite]
        state: present
        update_cache: yes

    - name: Criar diretórios de trabalho
      file:
        path: /home/debian/gardenia
        state: directory
        owner: debian
        group: debian

    - name: Copiar pipeline_vm2.R
      copy:
        src: ../../simulador/pipeline_vm2.R
        dest: /home/debian/gardenia/pipeline_vm2.R
        owner: debian
        mode: '0755'

# Configuração da VM 3 (Big Data / Spark)
- name: Configurar VM 3 - Spark Big Data
  hosts: vm_spark
  become: yes
  tasks:
    - name: Instalar Java, R e dependências do sistema
      apt:
        name: 
          - default-jre-headless
          - r-base
          - r-base-dev
          - r-cran-tidyverse
          - r-cran-jsonlite
          - r-cran-optparse
          - libssl-dev
          - libcurl4-openssl-dev
          - libxml2-dev
        state: present
        update_cache: yes

    - name: Garantir permissões do usuário debian em sua pasta home
      file:
        path: /home/debian
        owner: debian
        group: debian
        recurse: yes

    - name: Instalar sparklyr via CRAN
      command: Rscript -e "if (!require('sparklyr', quietly = TRUE)) install.packages('sparklyr', repos='https://cloud.r-project.org')"
      register: sparklyr_install
      changed_when: "'installing' in sparklyr_install.stdout or 'installing' in sparklyr_install.stderr"

    - name: Baixar e Instalar binários do Apache Spark no R para o usuário debian
      become: yes
      become_user: debian
      command: >
        Rscript -e "avail <- sparklyr::spark_available_versions(); v3 <- tail(avail$spark[startsWith(avail$spark, '3.')], 1); if (nrow(sparklyr::spark_installed_versions()) == 0) sparklyr::spark_install(version = v3)"
    - name: Criar diretórios de trabalho
      file:
        path: /home/debian/spark_work
        state: directory
        owner: debian
        group: debian

    - name: Copiar pipeline_vm3.R
      copy:
        src: ../../simulador/pipeline_vm3.R
        dest: /home/debian/spark_work/pipeline_vm3.R
        owner: debian
        mode: '0755'