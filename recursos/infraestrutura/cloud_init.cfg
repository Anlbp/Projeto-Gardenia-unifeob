#cloud-config
users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  renanaugusto@renan-biglinux

write_files:
  - path: /home/debian/.ssh/id_rsa
    owner: debian:debian
    permissions: '0600'
    content: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      ssh-rsa  renanaugusto@renan-biglinux
      -----END OPENSSH PRIVATE KEY-----

packages:
  - qemu-guest-agent
  - python3
  - python3-pip

runcmd:
  - systemctl start qemu-guest-agent
  - chown -R debian:debian /home/debian/.ssh