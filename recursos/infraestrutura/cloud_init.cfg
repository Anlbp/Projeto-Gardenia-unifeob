#cloud-config
users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  renan@aluno-OptiPlex-SFF-Plus-7020
# Nota: Substitua a linha ssh-rsa AAAA... pelo conteúdo do seu arquivo de chave pública local (geralmente localizado em ~/.ssh/id_rsa.pub).
# Se não houver, rode no terminal: user@pc: ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""

packages:
  - qemu-guest-agent
  - python3

runcmd:
  - systemctl start qemu-guest-agent

network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true